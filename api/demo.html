<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-api · Demo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  textarea, input {
    width: 100%;
    background: #0d0f14;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    resize: vertical;
  }
  textarea { min-height: 88px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    margin-top: 14px;
    width: 100%;
    background: var(--accent);
    color: #08111f;
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .out { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
  }
  .b-pending { color: var(--muted); }
  .b-running { color: var(--accent); }
  .b-done { color: var(--ok); border-color: var(--ok); }
  .b-failed { color: var(--err); border-color: var(--err); }
  .step {
    font-family: monospace;
    font-size: 13px;
    margin: 4px 0;
    padding: 6px 10px;
    background: #0d0f14;
    border: 1px solid var(--border);
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .step-kind { font-weight: 600; color: var(--accent); }
  .step-tool { color: var(--warn); }
  .step-detail { color: var(--text); margin-top: 2px; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>agent-api</h1>
    <p class="sub">异步 LLM 任务 · 提交后轮询结果。接口文档见 <a href="/healthz">/healthz</a> · <a href="/metrics">/metrics</a></p>

    <div class="card">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="例如：帮我算一下 (12+8)*3 是多少？现在几点了？"></textarea>
      <div class="row" style="margin-top:12px">
        <div>
          <label for="token">Bearer Token（可选，生产环境必填；填过一次会记住）</label>
          <input id="token" type="text" placeholder="留空则开发模式直发" autocomplete="off" />
        </div>
      </div>
      <button id="run">提交任务</button>
    </div>

    <div class="card">
      <label>结果</label>
      <div id="status" class="badge b-pending">空闲</div>
      <div id="out" class="out" style="margin-top:10px">—</div>
      <div id="trace" class="trace" style="margin-top:10px"></div>
      <div id="meta" class="meta"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = "agent_api_token";

// runId 每次提交自增。旧轮询循环每轮比对它，发现被新提交取代就自行退出，
// 避免多次提交后多个循环同时刷新同一块输出区。
let runId = 0;

function authHeaders(token) {
  return token ? { Authorization: "Bearer " + token } : {};
}

// explain 把 HTTP 错误翻成人话，401 单独给可行动的提示。
function explain(res, action) {
  if (res.status === 401) {
    return "鉴权失败（401）：Token 与服务端 API_AUTH_KEY 不一致";
  }
  return action + "失败：" + res.status;
}

async function postRun(prompt, token) {
  const res = await fetch("/run", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...authHeaders(token) },
    body: JSON.stringify({ prompt }),
  });
  if (!res.ok) throw new Error(explain(res, "提交"));
  const data = await res.json();
  return data.task_id;
}

async function getTask(id, token) {
  const res = await fetch("/tasks/" + id, { headers: authHeaders(token) });
  if (!res.ok) throw new Error(explain(res, "查询"));
  return res.json();
}

async function poll(id, token, myRun) {
  for (;;) {
    const task = await getTask(id, token);
    if (myRun !== runId) return;

    renderSteps(task.steps);
    setBadge(task.status);
    if (task.status === "done") {
      $("out").textContent = task.result || "(空)";
      return;
    }
    if (task.status === "failed") {
      $("out").textContent = task.error || "执行失败";
      return;
    }
    $("out").textContent = "状态：" + task.status + " …";
    await new Promise((r) => setTimeout(r, 1000));
    if (myRun !== runId) return;
  }
}

function renderSteps(steps) {
  const container = $("trace");
  container.replaceChildren();
  if (!Array.isArray(steps) || steps.length === 0) return;

  for (const s of steps) {
    const item = document.createElement("div");
    item.className = "step";

    const header = document.createElement("div");
    const kind = document.createElement("span");
    kind.className = "step-kind";
    kind.textContent = (s.step != null ? "#" + s.step + " " : "") + (s.kind || "");
    header.append(kind);

    if (s.tool) {
      const tool = document.createElement("span");
      tool.className = "step-tool";
      tool.textContent = " · " + s.tool;
      header.append(tool);
    }
    item.append(header);

    if (s.detail) {
      const detail = document.createElement("div");
      detail.className = "step-detail";
      detail.textContent = s.detail;
      item.append(detail);
    }

    container.append(item);
  }
}

function setBadge(status) {
  const el = $("status");
  el.className = "badge b-" + status;
  el.textContent = status;
}

$("run").addEventListener("click", async () => {
  const prompt = $("prompt").value.trim();
  const token = $("token").value.trim();
  if (!prompt) { alert("请先填写 prompt"); return; }
  if (token) localStorage.setItem(TOKEN_KEY, token);

  const myRun = ++runId;
  $("run").disabled = true;
  setBadge("pending");
  $("out").textContent = "提交中…";
  $("meta").textContent = "";
  $("trace").replaceChildren();

  try {
    const id = await postRun(prompt, token);
    if (myRun !== runId) return;
    $("meta").textContent = "task_id: " + id;
    $("out").textContent = "已提交，轮询中…";
    await poll(id, token, myRun);
  } catch (e) {
    if (myRun !== runId) return;
    setBadge("failed");
    $("out").textContent = String(e.message || e);
  } finally {
    if (myRun === runId) $("run").disabled = false;
  }
});

// 回填上次用过的 Token，省去每次手输
$("token").value = localStorage.getItem(TOKEN_KEY) || "";
</script>
</body>
</html>
